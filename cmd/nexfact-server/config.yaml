# nexfact-server configuration
env_dir: "./env"
rpc_addr: "127.0.0.1:8080"

watch_dir: "./watch"
processed_dir: "./processed"
error_dir: "./error"

# Time Durations
poll_interval: 2s
heartbeat_interval: 5s

#Logging
log:
  file_name: "logger.log"
  timeout: 1s
  expiry: 2s
  use_locking: true
  level: "info"
